[package]
name = "textdistance"
version = "4.6.2"
edition = "2021"
description = "Compute distance between sequences. 30+ algorithms, Rust implementation."
license = "MIT"
repository = "https://github.com/hemv-857/textdistance-rs"

[lib]
name = "textdistance"
crate-type = ["lib"]

[[bin]]
name = "textdistance"
path = "src/main.rs"

[dependencies]
# Compression algorithms
bzip2 = "0.5"
flate2 = "1.1"
lzma-rs = "0.1"

# For arithmetic coding / fractions
num-rational = "0.4"
num-bigint = "0.4"
num-traits = "0.2"

# For regex in some algorithms
regex = "1"

# For matrix operations (Mahalanobis, Correlation)
nalgebra = "0.33"

# CLI
clap = { version = "4", features = ["derive"], optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
proptest = "1"

[[bench]]
name = "textdistance_bench"
harness = false

[features]
default = ["cli"]
cli = ["clap"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
